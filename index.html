<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabVision</title>
    <link rel="stylesheet" href="style.css">
    <!-- No external fonts/CDN links: the app relies only on locally installed system fonts to stay 100% offline. -->
</head>
<body class="light-theme">

    <header id="main-header">
        <div class="brand">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12h4l2 7 4-14 2 7h6"></path>
            </svg>
            <h1 data-lang-key="headerTitle">LabVision</h1>
        </div>
        <div class="header-controls">
            <div class="language-switcher">
                <div class="lang-tab" id="lang-fa">FA</div>
                <div class="lang-tab active" id="lang-en">EN</div>
            </div>
            <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                </svg>
            </button>
        </div>
    </header>

    <div class="container">
        <main class="main-content">
            <section class="input-section">
                <h2 data-lang-key="inputHeader">اطلاعات برگه آزمایش</h2>

                <div class="gender-selector">
                    <span data-lang-key="selectGender">جنسیت:</span>
                    <label>
                        <input type="radio" name="gender" value="male" checked>
                        <span data-lang-key="genderMale">مرد</span>
                    </label>
                    <label>
                        <input type="radio" name="gender" value="female">
                        <span data-lang-key="genderFemale">زن</span>
                    </label>
                </div>

                <details class="optional-details">
                    <summary data-lang-key="optionalDetailsSummary">مشخصات برگه (اختیاری)</summary>
                    <div class="optional-details-grid">
                        <div class="field">
                            <label for="patient-name" data-lang-key="patientNameLabel">نام بیمار</label>
                            <input type="text" id="patient-name" data-lang-key-placeholder="patientNamePlaceholder">
                        </div>
                        <div class="field">
                            <label for="patient-age" data-lang-key="patientAgeLabel">سن بیمار</label>
                            <input type="number" id="patient-age" min="0" max="120" data-lang-key-placeholder="patientAgePlaceholder">
                        </div>
                        <div class="field">
                            <label for="doctor-name" data-lang-key="doctorNameLabel">پزشک معالج</label>
                            <input type="text" id="doctor-name" data-lang-key-placeholder="doctorNamePlaceholder">
                        </div>
                        <div class="field">
                            <label for="lab-name" data-lang-key="labNameLabel">نام آزمایشگاه</label>
                            <input type="text" id="lab-name" data-lang-key-placeholder="labNamePlaceholder">
                        </div>
                        <div class="field">
                            <label for="sample-date" data-lang-key="sampleDateLabel">تاریخ نمونه‌گیری</label>
                            <input type="date" id="sample-date">
                        </div>
                    </div>
                </details>

                <p class="input-hint" data-lang-key="inputHint">هر آیتم را در یک خط جدید وارد کنید. مثال: Glucose: 95</p>

                <div class="pulse-divider" aria-hidden="true">
                    <svg viewBox="0 0 400 20" preserveAspectRatio="none">
                        <polyline points="0,10 130,10 145,10 155,2 165,18 175,10 190,10 400,10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>
                    </svg>
                </div>

                <textarea id="lab-input" rows="14" placeholder="Hb: 14.5&#10;Platelet: 250&#10;TSH: 2.1"></textarea>
                <button id="process-btn" data-lang-key="processButton">تحلیل نتایج</button>
            </section>

            <section class="results-section">
                <h2 data-lang-key="resultsHeader">تفسیر نتایج</h2>
                <div id="results-output">
                    <p class="placeholder" data-lang-key="resultsPlaceholder">نتایج تحلیل آزمایش شما در اینجا نمایش داده می‌شود.</p>
                </div>
                <button id="print-btn" class="btn-secondary" data-lang-key="printButton">چاپ / خروجی PDF</button>
            </section>
        </main>
    </div>

    <script src="database.js"></script>
    <script src="script.js"></script>
</body>
</html>
